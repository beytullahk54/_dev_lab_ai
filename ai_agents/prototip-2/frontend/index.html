<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 680px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    header {
      padding: 20px 24px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .dot {
      width: 10px; height: 10px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    header h1 { font-size: 1rem; font-weight: 600; color: #f1f5f9; }
    header small { font-size: 0.75rem; color: #64748b; margin-left: auto; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: #3b82f6;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.agent {
      align-self: flex-start;
      background: #334155;
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
    }

    .msg.system {
      align-self: center;
      background: transparent;
      color: #475569;
      font-size: 0.78rem;
      padding: 4px 8px;
    }

    .typing {
      align-self: flex-start;
      background: #334155;
      border-radius: 12px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      display: flex;
      gap: 5px;
    }

    .typing span {
      width: 7px; height: 7px;
      background: #64748b;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    .input-area {
      padding: 16px 20px;
      border-top: 1px solid #334155;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: #0f172a;
    }

    #userInput {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #e2e8f0;
      padding: 10px 14px;
      font-size: 0.9rem;
      resize: none;
      line-height: 1.5;
      max-height: 120px;
      outline: none;
      transition: border-color 0.2s;
    }

    #userInput:focus { border-color: #3b82f6; }
    #userInput::placeholder { color: #475569; }

    #sendBtn {
      background: #3b82f6;
      border: none;
      border-radius: 10px;
      color: #fff;
      padding: 10px 18px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      height: 42px;
      white-space: nowrap;
    }

    #sendBtn:hover:not(:disabled) { background: #2563eb; }
    #sendBtn:active:not(:disabled) { transform: scale(0.96); }
    #sendBtn:disabled { background: #1e40af; opacity: 0.5; cursor: not-allowed; }

    .hint-bar {
      padding: 8px 24px 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hint {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.75rem;
      color: #94a3b8;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .hint:hover { border-color: #3b82f6; color: #e2e8f0; }
  </style>
</head>
<body>
<div class="chat-wrapper">
  <header>
    <div class="dot"></div>
    <h1>AI Agent</h1>
    <small>LangGraph + Groq + SQLite</small>
  </header>

  <div class="hint-bar">
    <span class="hint" onclick="fillHint('Beytullah için kayıt aç')">👤 Beytullah için kayıt aç</span>
    <span class="hint" onclick="fillHint('Kaç kullanıcımız var?')">📊 Kaç kullanıcımız var?</span>
  </div>

  <div id="messages">
    <div class="msg system">Merhaba! Kayıt açmak veya kullanıcı sayısını öğrenmek için yazabilirsin.</div>
  </div>

  <div class="input-area">
    <textarea id="userInput" rows="1" placeholder="Mesajını yaz..." onkeydown="handleKey(event)"></textarea>
    <button id="sendBtn" onclick="sendMessage()">Gönder</button>
  </div>
</div>

<script>
  const messagesDiv = document.getElementById('messages');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  let ws;

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => appendMsg('system', '🔗 Bağlantı kuruldu.');
    ws.onclose = () => {
      appendMsg('system', '⚠️ Bağlantı kesildi. Yeniden bağlanılıyor...');
      setTimeout(connect, 2000);
    };
    ws.onerror = () => appendMsg('system', '❌ Bağlantı hatası.');
    ws.onmessage = (e) => {
      removeTyping();
      appendMsg('agent', e.data);
      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
    };
  }

  function appendMsg(type, text) {
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.textContent = text;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function sendMessage() {
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

    appendMsg('user', text);
    ws.send(text);
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    input.disabled = true;
    showTyping();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
    // auto-resize textarea
    setTimeout(() => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    }, 0);
  }

  function fillHint(text) {
    input.value = text;
    input.focus();
  }

  connect();
</script>
</body>
</html>
